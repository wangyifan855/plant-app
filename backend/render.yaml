services:
  - type: web
    name: graftcheck-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: IDENTIFIER
        value: model
      # 新机没有本地模型缓存，启动时会从镜像下载模型
      - key: HF_HUB_OFFLINE
        value: "0"
      - key: HF_ENDPOINT
        value: https://hf-mirror.com
